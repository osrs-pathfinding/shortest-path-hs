<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OSRS Account Builds</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="m-0 min-h-screen bg-stone-100 text-stone-900 antialiased">
    <header class="border-b border-stone-300 bg-white">
      <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-4 sm:px-6">
        <h1 class="text-xl font-semibold">Account builds</h1>
        <a class="text-sm font-medium text-blue-700 underline decoration-blue-300 underline-offset-4 hover:text-blue-900" href="index.html">Map viewer</a>
      </div>
    </header>
    <main class="mx-auto max-w-7xl px-4 py-6 sm:px-6">
      <div id="profile-tabs" class="mb-6 flex max-w-full overflow-x-auto rounded-md shadow-sm" role="tablist" aria-label="Account profile"></div>
      <p id="status" class="text-sm text-stone-600" role="status">Loading account builds...</p>
      <article id="profile" class="hidden" aria-live="polite"></article>
    </main>
    <script src="accounts.js?v=1"></script>
  </body>
</html>
