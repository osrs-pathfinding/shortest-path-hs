<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OSRS Component Viewer</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="layout">
      <aside class="panel">
        <h1>Components</h1>
        <label>
          Component data
          <select id="shape-source-select">
            <option value="raw">Raw current</option>
            <option value="doors">Door-filtered</option>
          </select>
        </label>
        <label>
          Component
          <select id="component-select"></select>
        </label>
        <label>
          Plane
          <select id="plane-select">
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
          </select>
        </label>
        <label>
          Opacity
          <input id="opacity" type="range" min="0.1" max="1" step="0.05" value="0.45">
        </label>
        <label>
          View
          <select id="mode-select">
            <option value="all-components">All components</option>
            <option value="manual">Manual components</option>
            <option value="metis">METIS regions</option>
            <option value="kahip">KaHIP regions</option>
            <option value="heuristic">A* heuristic</option>
            <option value="difference">Difference</option>
            <option value="component-bitmap">Detailed components</option>
          </select>
        </label>
        <label class="checkbox-label"><input id="show-doors" type="checkbox"> Door layer</label>
        <button id="fit">Fit Component</button>
        <p id="status" role="status"></p>
        <div id="legend" class="legend"></div>
        <dl id="stats"></dl>
        <section class="routes" aria-labelledby="routes-heading">
          <h2 id="routes-heading">Routes</h2>
          <label>
            Test case
            <select id="route-case-select">
              <option value="">No fixture cases</option>
            </select>
          </label>
          <div class="coordinate-grid">
            <label>Start X<input id="start-x" type="number" step="1"></label>
            <label>Start Y<input id="start-y" type="number" step="1"></label>
            <label>Start P<input id="start-plane" type="number" min="0" max="3" step="1"></label>
            <label>End X<input id="end-x" type="number" step="1"></label>
            <label>End Y<input id="end-y" type="number" step="1"></label>
            <label>End P<input id="end-plane" type="number" min="0" max="3" step="1"></label>
          </div>
          <label class="checkbox-label"><input id="allow-transports" type="checkbox" checked> Allow transports</label>
          <label class="checkbox-label"><input id="include-expanded" type="checkbox"> Trace expanded tiles</label>
          <label>
            Account
            <select id="account-profile">
              <option value="">Everything enabled</option>
              <option value="early">Early</option>
              <option value="mid">Mid</option>
              <option value="end">End</option>
              <option value="maxed">Maxed</option>
            </select>
          </label>
          <label>
            Search
            <select id="route-algorithm">
              <option value="astar">Tile A*</option>
              <option value="dijkstra">Dijkstra</option>
            </select>
          </label>
          <label>
            Heuristic weight
            <input id="heuristic-weight" type="number" min="0" max="10" step="0.05" value="1">
          </label>
          <div class="route-actions">
            <button id="run-route" type="button">Run route</button>
            <button id="fit-route" type="button">Fit route</button>
          </div>
          <div class="map-pick" role="group" aria-label="Map click target">
            <span>Map clicks set</span>
            <label><input type="radio" name="pick-mode" value="start" checked> start</label>
            <label><input type="radio" name="pick-mode" value="end"> end</label>
          </div>
          <p id="route-status" role="status"></p>
          <dl id="route-stats"></dl>
        </section>
      </aside>
      <section id="map"></section>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js?v=weighted-astar-v1"></script>
  </body>
</html>
