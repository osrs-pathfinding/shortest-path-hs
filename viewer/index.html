<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OSRS Component Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.4.3/dist/css/tom-select.css">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="m-0 h-screen overflow-hidden bg-white text-stone-900 antialiased">
    <main class="grid h-full grid-cols-1 grid-rows-[auto_minmax(0,1fr)] md:grid-cols-[320px_minmax(0,1fr)] md:grid-rows-1">
      <aside class="z-[500] max-h-[42vh] overflow-y-auto border-b border-stone-300 bg-stone-50/95 p-4 md:max-h-none md:border-r md:border-b-0 md:p-5">
        <div class="mb-4 flex items-center justify-between gap-3">
          <h1 class="text-xl font-semibold">Components</h1>
          <a class="text-sm font-medium text-blue-700 underline decoration-blue-300 underline-offset-4 hover:text-blue-900" href="accounts.html">Account builds</a>
        </div>
        <label class="mb-3 grid gap-1.5 text-xs font-semibold">
          Component data
          <select id="shape-source-select" class="w-full rounded-md border border-stone-300 bg-white px-2.5 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">
            <option value="raw">Raw current</option>
            <option value="doors">Door-filtered</option>
          </select>
        </label>
        <label class="mb-3 grid gap-1.5 text-xs font-semibold">
          Component
          <select id="component-select" class="w-full rounded-md border border-stone-300 bg-white px-2.5 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"></select>
        </label>
        <label class="mb-3 grid gap-1.5 text-xs font-semibold">
          Plane
          <select id="plane-select" class="w-full rounded-md border border-stone-300 bg-white px-2.5 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
          </select>
        </label>
        <label class="mb-3 grid gap-1.5 text-xs font-semibold">
          Opacity
          <input id="opacity" class="w-full accent-blue-600" type="range" min="0.1" max="1" step="0.05" value="0.45">
        </label>
        <label class="mb-3 grid gap-1.5 text-xs font-semibold">
          View
          <select id="mode-select" class="w-full rounded-md border border-stone-300 bg-white px-2.5 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">
            <option value="all-components">All components</option>
            <option value="manual">Manual components</option>
            <option value="metis">METIS regions</option>
            <option value="kahip">KaHIP regions</option>
            <option value="heuristic">A* heuristic</option>
            <option value="difference">Difference</option>
            <option value="component-bitmap">Detailed components</option>
          </select>
        </label>
        <label class="mb-2 flex items-center gap-2 text-xs font-medium"><input id="show-transports" class="h-4 w-4 accent-blue-600" type="checkbox"> Transports</label>
        <label class="mb-3 grid gap-1.5 text-xs font-semibold">
          Transport type
          <select id="transport-type-select" class="w-full rounded-md border border-stone-300 bg-white px-2.5 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">
            <option value="">All</option>
          </select>
        </label>
        <label class="mb-2 flex items-center gap-2 text-xs font-medium"><input id="show-doors" class="h-4 w-4 accent-blue-600" type="checkbox"> Door layer</label>
        <label class="mb-3 flex items-center gap-2 text-xs font-medium"><input id="show-benchmark-coverage" class="h-4 w-4 accent-blue-600" type="checkbox"> Benchmark start/end coverage</label>
        <label class="mb-3 flex items-center gap-2 text-xs font-medium"><input id="show-endpoint-refinement" class="h-4 w-4 accent-blue-600" type="checkbox"> Raw → corrected endpoints</label>
        <button id="fit" class="mb-3 w-full rounded-md bg-stone-800 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-stone-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">Fit Component</button>
        <p id="status" class="mb-3 text-xs leading-5 text-stone-600" role="status"></p>
        <div id="legend" class="legend mb-4 grid gap-1.5"></div>
        <dl id="stats" class="grid grid-cols-[1fr_auto] gap-x-3 gap-y-2 text-xs"></dl>
        <dl id="transport-stats" class="mt-4 grid grid-cols-[1fr_auto] gap-x-3 gap-y-2 border-t border-stone-300 pt-4 text-xs"></dl>
        <section class="mt-4 border-t border-stone-300 pt-4" aria-labelledby="routes-heading">
          <h2 id="routes-heading" class="mb-3 text-sm font-semibold">Routes</h2>
          <label class="mb-3 grid gap-1.5 text-xs font-semibold">
            Test case
            <select id="route-case-select" placeholder="Search routes" autocomplete="off"></select>
          </label>
          <div class="mb-3 grid grid-cols-3 gap-2">
            <label class="grid min-w-0 gap-1 text-[11px] font-semibold">Start X<input id="start-x" class="min-w-0 w-full rounded-md border border-stone-300 bg-white px-1.5 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200" type="number" step="1"></label>
            <label class="grid min-w-0 gap-1 text-[11px] font-semibold">Start Y<input id="start-y" class="min-w-0 w-full rounded-md border border-stone-300 bg-white px-1.5 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200" type="number" step="1"></label>
            <label class="grid min-w-0 gap-1 text-[11px] font-semibold">Start P<input id="start-plane" class="min-w-0 w-full rounded-md border border-stone-300 bg-white px-1.5 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200" type="number" min="0" max="3" step="1"></label>
            <label class="grid min-w-0 gap-1 text-[11px] font-semibold">End X<input id="end-x" class="min-w-0 w-full rounded-md border border-stone-300 bg-white px-1.5 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200" type="number" step="1"></label>
            <label class="grid min-w-0 gap-1 text-[11px] font-semibold">End Y<input id="end-y" class="min-w-0 w-full rounded-md border border-stone-300 bg-white px-1.5 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200" type="number" step="1"></label>
            <label class="grid min-w-0 gap-1 text-[11px] font-semibold">End P<input id="end-plane" class="min-w-0 w-full rounded-md border border-stone-300 bg-white px-1.5 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200" type="number" min="0" max="3" step="1"></label>
          </div>
          <label class="mb-2 flex items-center gap-2 text-xs font-medium"><input id="allow-transports" class="h-4 w-4 accent-blue-600" type="checkbox" checked> Allow transports</label>
          <label class="mb-3 flex items-center gap-2 text-xs font-medium"><input id="include-expanded" class="h-4 w-4 accent-blue-600" type="checkbox"> Trace expanded tiles</label>
          <label class="mb-3 grid gap-1.5 text-xs font-semibold">
            Account
            <select id="account-profile" class="w-full rounded-md border border-stone-300 bg-white px-2.5 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">
              <option value="">Everything enabled</option>
              <option value="early">Early</option>
              <option value="mid">Mid</option>
              <option value="end">End</option>
              <option value="maxed">Maxed</option>
            </select>
          </label>
          <label class="mb-3 grid gap-1.5 text-xs font-semibold">
            Search
            <select id="route-algorithm" class="w-full rounded-md border border-stone-300 bg-white px-2.5 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">
              <option value="astar">Tile A*</option>
              <option value="dijkstra">Dijkstra</option>
            </select>
          </label>
          <label class="mb-3 grid gap-1.5 text-xs font-semibold">
            Heuristic weight
            <input id="heuristic-weight" class="w-full rounded-md border border-stone-300 bg-white px-2.5 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200" type="number" min="0" max="10" step="0.05" value="1">
          </label>
          <div class="mb-3 grid grid-cols-2 gap-2">
            <button id="run-route" class="rounded-md bg-stone-800 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-stone-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2" type="button">Run route</button>
            <button id="fit-route" class="rounded-md bg-stone-800 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-stone-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2" type="button">Fit route</button>
            <button id="compare-routes" class="col-span-2 rounded-md bg-blue-700 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2" type="button">Compare routes</button>
          </div>
          <div class="mb-3 flex flex-wrap items-center gap-2 text-xs" role="group" aria-label="Map click target">
            <span class="mr-0.5 text-stone-600">Map clicks set</span>
            <label class="flex items-center gap-1.5 font-medium"><input class="h-4 w-4 accent-blue-600" type="radio" name="pick-mode" value="start" checked> start</label>
            <label class="flex items-center gap-1.5 font-medium"><input class="h-4 w-4 accent-blue-600" type="radio" name="pick-mode" value="end"> end</label>
          </div>
          <p id="route-status" class="mb-3 text-xs leading-5 text-stone-600" role="status"></p>
          <dl id="route-stats" class="grid grid-cols-[1fr_auto] gap-x-3 gap-y-2 text-xs"></dl>
        </section>
      </aside>
      <section id="map" class="min-h-0"></section>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.4.3/dist/js/tom-select.complete.min.js"></script>
    <script src="app.js?v=tailwind-ui-v1"></script>
  </body>
</html>
