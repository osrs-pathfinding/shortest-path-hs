apiVersion: dashboard.grafana.app/v1beta1
kind: Dashboard
metadata:
  name: osrs-benchmark-negative
  annotations:
    grafana.app/folder: osrs-benchmarks
spec:
  title: OSRS Negative Benchmarks
  description: Correctness and search cost for profile-specific expected-unreachable cases.
  tags: [osrs, benchmark, negative]
  timezone: browser
  schemaVersion: 39
  time:
    from: now-30d
    to: now
  templating:
    list:
      - name: run
        label: Run
        type: query
        datasource: &clickhouse {type: grafana-clickhouse-datasource, uid: PDEE91DDB90597936}
        query: SELECT run_id AS __text, run_id AS __value FROM osrs_bench.runs ORDER BY created_at DESC
        refresh: 1
        includeAll: false
        multi: false
      - name: profile
        label: Profile
        type: custom
        multi: true
        includeAll: true
        allValue: early,mid,end,maxed
        options:
          - {text: All, value: "$__all", selected: true}
          - {text: early, value: early}
          - {text: mid, value: mid}
          - {text: end, value: end}
          - {text: maxed, value: maxed}
  panels:
    - id: 1
      title: Negative Expectations
      description: A pass means both Tile A* and the oracle found no route.
      type: table
      gridPos: {x: 0, y: 0, w: 12, h: 6}
      datasource: *clickhouse
      targets:
        - refId: A
          format: table
          rawSql: SELECT uniqExact((profile, route_id)) AS total, uniqExactIf((profile, route_id), reachable = 0 AND oracle_reachable = 0) AS passed, uniqExactIf((profile, route_id), reachable = 1) AS unexpectedly_reachable, uniqExactIf((profile, route_id), oracle_reachable = 1) AS oracle_disagreements FROM osrs_bench.samples WHERE run_id = '${run}' AND expectation = 'negative' AND profile IN (${profile:sqlstring})
    - id: 2
      title: Negative Search Distribution
      type: table
      gridPos: {x: 12, y: 0, w: 12, h: 6}
      datasource: *clickhouse
      targets:
        - refId: A
          format: table
          rawSql: SELECT profile, count() AS cases, quantileExact(0.50)(value) AS p50_ms, quantileExact(0.95)(value) AS p95_ms, quantileExact(0.99)(value) AS p99_ms, max(value) AS max_ms FROM osrs_bench.case_metrics WHERE run_id = '${run}' AND expectation = 'negative' AND metric = 'total_ms' AND profile IN (${profile:sqlstring}) GROUP BY profile ORDER BY profile
    - id: 3
      title: Negative Search Work
      type: table
      gridPos: {x: 0, y: 6, w: 12, h: 8}
      datasource: *clickhouse
      targets:
        - refId: A
          format: table
          rawSql: SELECT profile, count() AS cases, quantileExact(0.50)(value) AS p50_states, quantileExact(0.95)(value) AS p95_states, quantileExact(0.99)(value) AS p99_states, max(value) AS max_states FROM osrs_bench.case_metrics WHERE run_id = '${run}' AND expectation = 'negative' AND metric = 'states_popped' AND profile IN (${profile:sqlstring}) GROUP BY profile ORDER BY profile
    - id: 4
      title: Most Expensive Negative Cases
      type: table
      gridPos: {x: 12, y: 6, w: 12, h: 8}
      datasource: *clickhouse
      targets:
        - refId: A
          format: table
          rawSql: SELECT profile, route_id, route_label, category, value AS total_ms, repetitions FROM osrs_bench.case_metrics WHERE run_id = '${run}' AND expectation = 'negative' AND metric = 'total_ms' AND profile IN (${profile:sqlstring}) ORDER BY total_ms DESC LIMIT 100
    - id: 5
      title: Negative Search Cost Over Time
      type: timeseries
      gridPos: {x: 0, y: 14, w: 12, h: 9}
      datasource: *clickhouse
      fieldConfig:
        defaults: {unit: ms}
        overrides: []
      targets:
        - refId: A
          format: time_series
          rawSql: SELECT r.created_at AS time, s.profile, quantileExact(0.95)(s.metrics['total_ms']) AS p95_ms FROM osrs_bench.samples s INNER JOIN osrs_bench.runs r ON r.run_id = s.run_id WHERE s.expectation = 'negative' AND s.profile IN (${profile:sqlstring}) GROUP BY time, s.profile ORDER BY time
    - id: 6
      title: Negative Case Count Over Time
      type: timeseries
      gridPos: {x: 12, y: 14, w: 12, h: 9}
      datasource: *clickhouse
      targets:
        - refId: A
          format: time_series
          rawSql: SELECT r.created_at AS time, s.profile, uniqExact((s.profile, s.route_id)) AS cases FROM osrs_bench.samples s INNER JOIN osrs_bench.runs r ON r.run_id = s.run_id WHERE s.expectation = 'negative' AND s.profile IN (${profile:sqlstring}) GROUP BY time, s.profile ORDER BY time
    - id: 7
      title: Account Progression Boundaries
      description: Expectations are stored with the selected run; changes between runs are semantic corpus changes.
      type: table
      gridPos: {x: 0, y: 23, w: 24, h: 10}
      datasource: *clickhouse
      targets:
        - refId: A
          format: table
          rawSql: SELECT route_id, any(route_label) AS route_label, any(category) AS category, maxIf(expectation, profile = 'early') AS early, maxIf(expectation, profile = 'mid') AS mid, maxIf(expectation, profile = 'end') AS end, maxIf(expectation, profile = 'maxed') AS maxed FROM osrs_bench.samples WHERE run_id = '${run}' GROUP BY route_id HAVING has(groupArray(expectation), 'negative') ORDER BY route_id
