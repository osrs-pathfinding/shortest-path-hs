apiVersion: dashboard.grafana.app/v1beta1
kind: Dashboard
metadata:
  name: osrs-weighted-astar-sweep
  annotations:
    grafana.app/folder: osrs-benchmarks
spec:
  title: OSRS Weighted A* Sweep
  description: Compare weighted-A* distribution shape, tail behaviour, and route-quality trade-offs within one sweep and commit.
  tags: [osrs, benchmark, weighted-astar]
  timezone: browser
  schemaVersion: 39
  time:
    from: now-30d
    to: now
  templating:
    list:
      - name: sweep
        label: Sweep
        type: query
        datasource: &clickhouse {type: grafana-clickhouse-datasource, uid: PDEE91DDB90597936}
        query: SELECT if(empty(metadata['sweep']), run_id, metadata['sweep']) AS __value, concat(__value, ' · ', git_commit) AS __text FROM osrs_bench.runs GROUP BY __value, git_commit ORDER BY max(created_at) DESC
        refresh: 1
        includeAll: false
        multi: false
      - name: commit
        label: Git commit
        type: query
        datasource: *clickhouse
        query: SELECT DISTINCT git_commit AS __text, git_commit AS __value FROM osrs_bench.runs WHERE if(empty(metadata['sweep']), run_id, metadata['sweep']) = ${sweep:sqlstring} ORDER BY git_commit
        refresh: 1
        includeAll: false
        multi: false
      - name: profile
        label: Account profile
        type: query
        datasource: *clickhouse
        query: SELECT DISTINCT profile AS __text, profile AS __value FROM osrs_bench.samples WHERE run_id IN (SELECT run_id FROM osrs_bench.runs WHERE if(empty(metadata['sweep']), run_id, metadata['sweep']) = ${sweep:sqlstring} AND git_commit = ${commit:sqlstring}) ORDER BY profile
        refresh: 1
        includeAll: true
        multi: true
        current: {text: All, value: $__all, selected: true}
      - name: category
        label: Category
        type: query
        datasource: *clickhouse
        query: SELECT DISTINCT category AS __text, category AS __value FROM osrs_bench.samples WHERE run_id IN (SELECT run_id FROM osrs_bench.runs WHERE if(empty(metadata['sweep']), run_id, metadata['sweep']) = ${sweep:sqlstring} AND git_commit = ${commit:sqlstring}) ORDER BY category
        refresh: 1
        includeAll: true
        multi: true
        current: {text: All, value: $__all, selected: true}
      - name: weight
        label: Heuristic weight
        type: query
        datasource: *clickhouse
        query: SELECT DISTINCT if(empty(metadata['heuristic_weight']), '1.0', metadata['heuristic_weight']) AS __text, __text AS __value FROM osrs_bench.runs WHERE if(empty(metadata['sweep']), run_id, metadata['sweep']) = ${sweep:sqlstring} AND git_commit = ${commit:sqlstring} ORDER BY toFloat64(__value)
        refresh: 1
        includeAll: true
        multi: true
        current: {text: All, value: $__all, selected: true}
  panels:
    - id: 1
      title: States Expanded CDF
      description: Median states_popped per route/profile. Lower and further left is better; logarithmic X axis.
      type: xychart
      gridPos: {x: 0, y: 0, w: 12, h: 9}
      datasource: *clickhouse
      fieldConfig: &logCountCdfFields
        defaults:
          color: {mode: palette-classic}
          custom:
            show: lines
            lineWidth: 2
            fillOpacity: 0
            pointSize: {fixed: 2}
            axisPlacement: left
            axisColorMode: text
            hideFrom: {tooltip: false, viz: false, legend: false}
        overrides:
          - matcher: {id: byName, options: metric_value}
            properties:
              - {id: unit, value: short}
              - {id: custom.axisLabel, value: States popped}
              - {id: custom.scaleDistribution, value: {type: log, log: 10}}
          - matcher: {id: byName, options: cdf}
            properties:
              - {id: unit, value: percent}
              - {id: min, value: 0}
              - {id: max, value: 100}
              - {id: custom.axisLabel, value: Cases ≤ X}
              - {id: custom.scaleDistribution, value: {type: linear}}
      options: &cdfOptions
        mapping: auto
        series: [{}]
        tooltip: {mode: single, sort: none}
        legend: {showLegend: true, displayMode: list, placement: bottom, calcs: []}
      transformations: &partitionByWeight
        - id: partitionByValues
          options: {fields: [heuristic_weight]}
      targets:
        - refId: A
          format: table
          rawSql: WITH run_set AS (SELECT run_id, if(empty(metadata['heuristic_weight']), '1.0', metadata['heuristic_weight']) AS heuristic_weight FROM osrs_bench.runs WHERE if(empty(metadata['sweep']), run_id, metadata['sweep']) = ${sweep:sqlstring} AND git_commit = ${commit:sqlstring}), ranked AS (SELECT concat('weight ', rs.heuristic_weight) AS heuristic_weight, m.value AS metric_value, row_number() OVER (PARTITION BY rs.heuristic_weight ORDER BY m.value) AS rank, count() OVER (PARTITION BY rs.heuristic_weight) AS cases FROM osrs_bench.case_metrics m INNER JOIN run_set rs ON rs.run_id = m.run_id WHERE m.metric = 'states_popped' AND m.profile IN (${profile:sqlstring}) AND m.category IN (${category:sqlstring}) AND rs.heuristic_weight IN (${weight:sqlstring})) SELECT heuristic_weight, metric_value, 100.0 * rank / cases AS cdf FROM ranked ORDER BY toFloat64(replaceOne(heuristic_weight, 'weight ', '')), metric_value

    - id: 2
      title: Search Time CDF
      description: Median search_ms per route/profile. Lower and further left is better; logarithmic X axis.
      type: xychart
      gridPos: {x: 12, y: 0, w: 12, h: 9}
      datasource: *clickhouse
      fieldConfig:
        defaults:
          color: {mode: palette-classic}
          custom:
            show: lines
            lineWidth: 2
            fillOpacity: 0
            pointSize: {fixed: 2}
            axisPlacement: left
            axisColorMode: text
            hideFrom: {tooltip: false, viz: false, legend: false}
        overrides:
          - matcher: {id: byName, options: metric_value}
            properties:
              - {id: unit, value: ms}
              - {id: custom.axisLabel, value: Search time}
              - {id: custom.scaleDistribution, value: {type: log, log: 10}}
          - matcher: {id: byName, options: cdf}
            properties:
              - {id: unit, value: percent}
              - {id: min, value: 0}
              - {id: max, value: 100}
              - {id: custom.axisLabel, value: Cases ≤ X}
              - {id: custom.scaleDistribution, value: {type: linear}}
      options: *cdfOptions
      transformations: *partitionByWeight
      targets:
        - refId: A
          format: table
          rawSql: WITH run_set AS (SELECT run_id, if(empty(metadata['heuristic_weight']), '1.0', metadata['heuristic_weight']) AS heuristic_weight FROM osrs_bench.runs WHERE if(empty(metadata['sweep']), run_id, metadata['sweep']) = ${sweep:sqlstring} AND git_commit = ${commit:sqlstring}), ranked AS (SELECT concat('weight ', rs.heuristic_weight) AS heuristic_weight, greatest(m.value, 0.001) AS metric_value, row_number() OVER (PARTITION BY rs.heuristic_weight ORDER BY m.value) AS rank, count() OVER (PARTITION BY rs.heuristic_weight) AS cases FROM osrs_bench.case_metrics m INNER JOIN run_set rs ON rs.run_id = m.run_id WHERE m.metric = 'search_ms' AND m.profile IN (${profile:sqlstring}) AND m.category IN (${category:sqlstring}) AND rs.heuristic_weight IN (${weight:sqlstring})) SELECT heuristic_weight, metric_value, 100.0 * rank / cases AS cdf FROM ranked ORDER BY toFloat64(replaceOne(heuristic_weight, 'weight ', '')), metric_value

    - id: 3
      title: Cost Gap CDF
      description: Reachable cases only. The vertical mass at zero is the percentage of optimal routes.
      type: xychart
      gridPos: {x: 0, y: 9, w: 12, h: 9}
      datasource: *clickhouse
      fieldConfig: &linearCdfFields
        defaults:
          color: {mode: palette-classic}
          custom:
            show: lines
            lineWidth: 2
            fillOpacity: 0
            pointSize: {fixed: 2}
            axisPlacement: left
            axisColorMode: text
            hideFrom: {tooltip: false, viz: false, legend: false}
        overrides:
          - matcher: {id: byName, options: metric_value}
            properties:
              - {id: unit, value: short}
              - {id: min, value: 0}
              - {id: custom.axisSoftMax, value: 5}
              - {id: custom.axisLabel, value: Extra ticks}
          - matcher: {id: byName, options: cdf}
            properties:
              - {id: unit, value: percent}
              - {id: min, value: 0}
              - {id: max, value: 100}
              - {id: custom.axisLabel, value: Routes ≤ X}
      options: *cdfOptions
      transformations: *partitionByWeight
      targets:
        - refId: A
          format: table
          rawSql: WITH run_set AS (SELECT run_id, if(empty(metadata['heuristic_weight']), '1.0', metadata['heuristic_weight']) AS heuristic_weight FROM osrs_bench.runs WHERE if(empty(metadata['sweep']), run_id, metadata['sweep']) = ${sweep:sqlstring} AND git_commit = ${commit:sqlstring}), cases AS (SELECT concat('weight ', rs.heuristic_weight) AS heuristic_weight, m.profile, m.route_id, maxIf(m.value, m.metric = 'path_cost') - maxIf(m.value, m.metric = 'expected_path_cost') AS metric_value, countIf(m.metric = 'path_cost') AS has_cost, countIf(m.metric = 'expected_path_cost') AS has_optimum FROM osrs_bench.case_metrics m INNER JOIN run_set rs ON rs.run_id = m.run_id WHERE m.profile IN (${profile:sqlstring}) AND m.category IN (${category:sqlstring}) AND rs.heuristic_weight IN (${weight:sqlstring}) GROUP BY heuristic_weight, m.profile, m.route_id HAVING has_cost > 0 AND has_optimum > 0 AND metric_value >= 0), ranked AS (SELECT *, row_number() OVER (PARTITION BY heuristic_weight ORDER BY metric_value) AS rank, count() OVER (PARTITION BY heuristic_weight) AS cases FROM cases) SELECT heuristic_weight, metric_value, 100.0 * rank / cases AS cdf FROM ranked ORDER BY toFloat64(replaceOne(heuristic_weight, 'weight ', '')), metric_value

    - id: 4
      title: Cost Ratio CDF
      description: Weighted cost divided by exact optimum. Reachable non-zero-cost cases only; the useful region begins at 1.0.
      type: xychart
      gridPos: {x: 12, y: 9, w: 12, h: 9}
      datasource: *clickhouse
      fieldConfig:
        defaults:
          color: {mode: palette-classic}
          decimals: 4
          custom:
            show: lines
            lineWidth: 2
            fillOpacity: 0
            pointSize: {fixed: 2}
            axisPlacement: left
            axisColorMode: text
            hideFrom: {tooltip: false, viz: false, legend: false}
        overrides:
          - matcher: {id: byName, options: metric_value}
            properties:
              - {id: min, value: 1}
              - {id: custom.axisSoftMin, value: 1}
              - {id: custom.axisSoftMax, value: 1.02}
              - {id: custom.axisLabel, value: Weighted / optimal cost}
          - matcher: {id: byName, options: cdf}
            properties:
              - {id: unit, value: percent}
              - {id: min, value: 0}
              - {id: max, value: 100}
              - {id: custom.axisLabel, value: Routes ≤ X}
      options: *cdfOptions
      transformations: *partitionByWeight
      targets:
        - refId: A
          format: table
          rawSql: WITH run_set AS (SELECT run_id, if(empty(metadata['heuristic_weight']), '1.0', metadata['heuristic_weight']) AS heuristic_weight FROM osrs_bench.runs WHERE if(empty(metadata['sweep']), run_id, metadata['sweep']) = ${sweep:sqlstring} AND git_commit = ${commit:sqlstring}), cases AS (SELECT concat('weight ', rs.heuristic_weight) AS heuristic_weight, m.profile, m.route_id, maxIf(m.value, m.metric = 'path_cost') / maxIf(m.value, m.metric = 'expected_path_cost') AS metric_value, countIf(m.metric = 'path_cost') AS has_cost, countIf(m.metric = 'expected_path_cost') AS has_optimum FROM osrs_bench.case_metrics m INNER JOIN run_set rs ON rs.run_id = m.run_id WHERE m.profile IN (${profile:sqlstring}) AND m.category IN (${category:sqlstring}) AND rs.heuristic_weight IN (${weight:sqlstring}) GROUP BY heuristic_weight, m.profile, m.route_id HAVING has_cost > 0 AND has_optimum > 0 AND maxIf(m.value, m.metric = 'expected_path_cost') > 0 AND metric_value >= 1), ranked AS (SELECT *, row_number() OVER (PARTITION BY heuristic_weight ORDER BY metric_value) AS rank, count() OVER (PARTITION BY heuristic_weight) AS cases FROM cases) SELECT heuristic_weight, metric_value, 100.0 * rank / cases AS cdf FROM ranked ORDER BY toFloat64(replaceOne(heuristic_weight, 'weight ', '')), metric_value

    - id: 5
      title: Relative Expansion CDF
      description: Weighted states_popped / matching weight-1.0 states_popped. 0.5 means half as many states; lower is better.
      type: xychart
      gridPos: {x: 0, y: 18, w: 12, h: 9}
      datasource: *clickhouse
      fieldConfig:
        defaults:
          color: {mode: palette-classic}
          decimals: 3
          custom:
            show: lines
            lineWidth: 2
            fillOpacity: 0
            pointSize: {fixed: 2}
            axisPlacement: left
            axisColorMode: text
            hideFrom: {tooltip: false, viz: false, legend: false}
        overrides:
          - matcher: {id: byName, options: metric_value}
            properties:
              - {id: custom.axisLabel, value: Weighted / exact states}
              - {id: custom.scaleDistribution, value: {type: log, log: 10}}
          - matcher: {id: byName, options: cdf}
            properties:
              - {id: unit, value: percent}
              - {id: min, value: 0}
              - {id: max, value: 100}
              - {id: custom.axisLabel, value: Cases ≤ X}
              - {id: custom.scaleDistribution, value: {type: linear}}
      options: *cdfOptions
      transformations: *partitionByWeight
      targets:
        - refId: A
          format: table
          rawSql: WITH run_set AS (SELECT run_id, if(empty(metadata['heuristic_weight']), '1.0', metadata['heuristic_weight']) AS heuristic_weight, coalesce(toFloat64OrNull(nullIf(metadata['heuristic_weight'], '')), 1.0) AS weight_value FROM osrs_bench.runs WHERE if(empty(metadata['sweep']), run_id, metadata['sweep']) = ${sweep:sqlstring} AND git_commit = ${commit:sqlstring}), exact AS (SELECT m.profile, m.route_id, any(m.value) AS value FROM osrs_bench.case_metrics m INNER JOIN run_set rs ON rs.run_id = m.run_id WHERE rs.weight_value = 1 AND m.metric = 'states_popped' AND m.profile IN (${profile:sqlstring}) AND m.category IN (${category:sqlstring}) GROUP BY m.profile, m.route_id), ratios AS (SELECT concat('weight ', rs.heuristic_weight) AS heuristic_weight, m.value / e.value AS metric_value FROM osrs_bench.case_metrics m INNER JOIN run_set rs ON rs.run_id = m.run_id INNER JOIN exact e ON e.profile = m.profile AND e.route_id = m.route_id WHERE m.metric = 'states_popped' AND e.value > 0 AND m.value > 0 AND m.profile IN (${profile:sqlstring}) AND m.category IN (${category:sqlstring}) AND rs.heuristic_weight IN (${weight:sqlstring})), ranked AS (SELECT *, row_number() OVER (PARTITION BY heuristic_weight ORDER BY metric_value) AS rank, count() OVER (PARTITION BY heuristic_weight) AS cases FROM ratios) SELECT heuristic_weight, metric_value, 100.0 * rank / cases AS cdf FROM ranked ORDER BY toFloat64(replaceOne(heuristic_weight, 'weight ', '')), metric_value

    - id: 6
      title: Search Speedup CDF
      description: Matching weight-1.0 search_ms / weighted search_ms. Values above 1 are faster; runtime is noisier than expansion count.
      type: xychart
      gridPos: {x: 12, y: 18, w: 12, h: 9}
      datasource: *clickhouse
      fieldConfig:
        defaults:
          color: {mode: palette-classic}
          decimals: 2
          custom:
            show: lines
            lineWidth: 2
            fillOpacity: 0
            pointSize: {fixed: 2}
            axisPlacement: left
            axisColorMode: text
            hideFrom: {tooltip: false, viz: false, legend: false}
        overrides:
          - matcher: {id: byName, options: metric_value}
            properties:
              - {id: custom.axisLabel, value: Exact / weighted search time}
              - {id: custom.scaleDistribution, value: {type: log, log: 10}}
          - matcher: {id: byName, options: cdf}
            properties:
              - {id: unit, value: percent}
              - {id: min, value: 0}
              - {id: max, value: 100}
              - {id: custom.axisLabel, value: Cases ≤ X}
              - {id: custom.scaleDistribution, value: {type: linear}}
      options: *cdfOptions
      transformations: *partitionByWeight
      targets:
        - refId: A
          format: table
          rawSql: WITH run_set AS (SELECT run_id, if(empty(metadata['heuristic_weight']), '1.0', metadata['heuristic_weight']) AS heuristic_weight, coalesce(toFloat64OrNull(nullIf(metadata['heuristic_weight'], '')), 1.0) AS weight_value FROM osrs_bench.runs WHERE if(empty(metadata['sweep']), run_id, metadata['sweep']) = ${sweep:sqlstring} AND git_commit = ${commit:sqlstring}), exact AS (SELECT m.profile, m.route_id, any(m.value) AS value FROM osrs_bench.case_metrics m INNER JOIN run_set rs ON rs.run_id = m.run_id WHERE rs.weight_value = 1 AND m.metric = 'search_ms' AND m.profile IN (${profile:sqlstring}) AND m.category IN (${category:sqlstring}) GROUP BY m.profile, m.route_id), ratios AS (SELECT concat('weight ', rs.heuristic_weight) AS heuristic_weight, e.value / m.value AS metric_value FROM osrs_bench.case_metrics m INNER JOIN run_set rs ON rs.run_id = m.run_id INNER JOIN exact e ON e.profile = m.profile AND e.route_id = m.route_id WHERE m.metric = 'search_ms' AND e.value > 0 AND m.value > 0 AND m.profile IN (${profile:sqlstring}) AND m.category IN (${category:sqlstring}) AND rs.heuristic_weight IN (${weight:sqlstring})), ranked AS (SELECT *, row_number() OVER (PARTITION BY heuristic_weight ORDER BY metric_value) AS rank, count() OVER (PARTITION BY heuristic_weight) AS cases FROM ratios) SELECT heuristic_weight, metric_value, 100.0 * rank / cases AS cdf FROM ranked ORDER BY toFloat64(replaceOne(heuristic_weight, 'weight ', '')), metric_value

    - id: 7
      title: Optimal Routes by Weight
      type: table
      gridPos: {x: 0, y: 27, w: 8, h: 8}
      datasource: *clickhouse
      fieldConfig:
        defaults: {}
        overrides:
          - matcher: {id: byName, options: optimal_percentage}
            properties: [{id: unit, value: percent}]
      targets:
        - refId: A
          format: table
          rawSql: WITH run_set AS (SELECT run_id, if(empty(metadata['heuristic_weight']), '1.0', metadata['heuristic_weight']) AS heuristic_weight FROM osrs_bench.runs WHERE if(empty(metadata['sweep']), run_id, metadata['sweep']) = ${sweep:sqlstring} AND git_commit = ${commit:sqlstring}), cases AS (SELECT rs.heuristic_weight, m.profile, m.route_id, maxIf(m.value, m.metric = 'path_cost') AS cost, maxIf(m.value, m.metric = 'expected_path_cost') AS optimum, countIf(m.metric = 'path_cost') AS has_cost, countIf(m.metric = 'expected_path_cost') AS has_optimum FROM osrs_bench.case_metrics m INNER JOIN run_set rs ON rs.run_id = m.run_id WHERE m.profile IN (${profile:sqlstring}) AND m.category IN (${category:sqlstring}) AND rs.heuristic_weight IN (${weight:sqlstring}) GROUP BY rs.heuristic_weight, m.profile, m.route_id HAVING has_cost > 0 AND has_optimum > 0) SELECT heuristic_weight, count() AS reachable_cases, 100.0 * countIf(cost = optimum) / count() AS optimal_percentage FROM cases GROUP BY heuristic_weight ORDER BY toFloat64(heuristic_weight)

    - id: 8
      title: Cost Gap Summary
      type: table
      gridPos: {x: 8, y: 27, w: 8, h: 8}
      datasource: *clickhouse
      targets:
        - refId: A
          format: table
          rawSql: WITH run_set AS (SELECT run_id, if(empty(metadata['heuristic_weight']), '1.0', metadata['heuristic_weight']) AS heuristic_weight FROM osrs_bench.runs WHERE if(empty(metadata['sweep']), run_id, metadata['sweep']) = ${sweep:sqlstring} AND git_commit = ${commit:sqlstring}), cases AS (SELECT rs.heuristic_weight, m.profile, m.route_id, maxIf(m.value, m.metric = 'path_cost') - maxIf(m.value, m.metric = 'expected_path_cost') AS gap, countIf(m.metric = 'path_cost') AS has_cost, countIf(m.metric = 'expected_path_cost') AS has_optimum FROM osrs_bench.case_metrics m INNER JOIN run_set rs ON rs.run_id = m.run_id WHERE m.profile IN (${profile:sqlstring}) AND m.category IN (${category:sqlstring}) AND rs.heuristic_weight IN (${weight:sqlstring}) GROUP BY rs.heuristic_weight, m.profile, m.route_id HAVING has_cost > 0 AND has_optimum > 0 AND gap >= 0) SELECT heuristic_weight, quantileExact(0.50)(gap) AS p50, quantileExact(0.95)(gap) AS p95, quantileExact(0.99)(gap) AS p99, max(gap) AS max FROM cases GROUP BY heuristic_weight ORDER BY toFloat64(heuristic_weight)

    - id: 9
      title: Search Work Summary
      type: table
      gridPos: {x: 16, y: 27, w: 8, h: 8}
      datasource: *clickhouse
      targets:
        - refId: A
          format: table
          rawSql: WITH run_set AS (SELECT run_id, if(empty(metadata['heuristic_weight']), '1.0', metadata['heuristic_weight']) AS heuristic_weight FROM osrs_bench.runs WHERE if(empty(metadata['sweep']), run_id, metadata['sweep']) = ${sweep:sqlstring} AND git_commit = ${commit:sqlstring}) SELECT rs.heuristic_weight, m.metric, quantileExact(0.50)(m.value) AS p50, quantileExact(0.95)(m.value) AS p95, quantileExact(0.99)(m.value) AS p99, max(m.value) AS max FROM osrs_bench.case_metrics m INNER JOIN run_set rs ON rs.run_id = m.run_id WHERE m.metric IN ('states_popped', 'search_ms') AND m.profile IN (${profile:sqlstring}) AND m.category IN (${category:sqlstring}) AND rs.heuristic_weight IN (${weight:sqlstring}) GROUP BY rs.heuristic_weight, m.metric ORDER BY toFloat64(rs.heuristic_weight), m.metric

    - id: 10
      title: Per-case Expansion Reduction vs Cost Gap
      description: X is 1 - weighted/exact states_popped; Y is extra ticks. Upper-right outliers trade more quality for less search.
      type: xychart
      gridPos: {x: 0, y: 35, w: 24, h: 11}
      datasource: *clickhouse
      fieldConfig:
        defaults:
          color: {mode: palette-classic}
          custom:
            show: points
            pointSize: {fixed: 4}
            lineWidth: 0
            fillOpacity: 20
            axisPlacement: left
            axisColorMode: text
            hideFrom: {tooltip: false, viz: false, legend: false}
        overrides:
          - matcher: {id: byName, options: expansion_reduction}
            properties:
              - {id: unit, value: percentunit}
              - {id: custom.axisSoftMin, value: -0.1}
              - {id: custom.axisSoftMax, value: 1}
              - {id: custom.axisLabel, value: Expansion reduction vs weight 1}
          - matcher: {id: byName, options: cost_gap_ticks}
            properties:
              - {id: unit, value: short}
              - {id: min, value: 0}
              - {id: custom.axisLabel, value: Extra ticks}
      options:
        mapping: auto
        series: [{}]
        tooltip: {mode: single, sort: none}
        legend: {showLegend: true, displayMode: list, placement: bottom, calcs: []}
      transformations: *partitionByWeight
      targets:
        - refId: A
          format: table
          rawSql: WITH run_set AS (SELECT run_id, if(empty(metadata['heuristic_weight']), '1.0', metadata['heuristic_weight']) AS heuristic_weight, coalesce(toFloat64OrNull(nullIf(metadata['heuristic_weight'], '')), 1.0) AS weight_value FROM osrs_bench.runs WHERE if(empty(metadata['sweep']), run_id, metadata['sweep']) = ${sweep:sqlstring} AND git_commit = ${commit:sqlstring}), exact AS (SELECT m.profile, m.route_id, any(m.value) AS states FROM osrs_bench.case_metrics m INNER JOIN run_set rs ON rs.run_id = m.run_id WHERE rs.weight_value = 1 AND m.metric = 'states_popped' AND m.profile IN (${profile:sqlstring}) AND m.category IN (${category:sqlstring}) GROUP BY m.profile, m.route_id), weighted AS (SELECT concat('weight ', rs.heuristic_weight) AS heuristic_weight, m.profile, m.route_id, maxIf(m.value, m.metric = 'states_popped') AS states, maxIf(m.value, m.metric = 'path_cost') - maxIf(m.value, m.metric = 'expected_path_cost') AS cost_gap_ticks, countIf(m.metric = 'path_cost') AS has_cost, countIf(m.metric = 'expected_path_cost') AS has_optimum FROM osrs_bench.case_metrics m INNER JOIN run_set rs ON rs.run_id = m.run_id WHERE m.profile IN (${profile:sqlstring}) AND m.category IN (${category:sqlstring}) AND rs.heuristic_weight IN (${weight:sqlstring}) GROUP BY heuristic_weight, m.profile, m.route_id HAVING has_cost > 0 AND has_optimum > 0 AND cost_gap_ticks >= 0) SELECT w.heuristic_weight, 1 - w.states / e.states AS expansion_reduction, w.cost_gap_ticks FROM weighted w INNER JOIN exact e ON e.profile = w.profile AND e.route_id = w.route_id WHERE e.states > 0 ORDER BY toFloat64(replaceOne(w.heuristic_weight, 'weight ', '')), expansion_reduction

    - id: 11
      title: Worst Route-quality Regressions
      type: table
      gridPos: {x: 0, y: 46, w: 24, h: 10}
      datasource: *clickhouse
      targets:
        - refId: A
          format: table
          rawSql: WITH run_set AS (SELECT run_id, if(empty(metadata['heuristic_weight']), '1.0', metadata['heuristic_weight']) AS heuristic_weight FROM osrs_bench.runs WHERE if(empty(metadata['sweep']), run_id, metadata['sweep']) = ${sweep:sqlstring} AND git_commit = ${commit:sqlstring}), cases AS (SELECT rs.heuristic_weight, m.profile, m.route_id, any(m.route_label) AS route_label, any(m.category) AS category, maxIf(m.value, m.metric = 'path_cost') AS weighted_cost, maxIf(m.value, m.metric = 'expected_path_cost') AS optimal_cost, countIf(m.metric = 'path_cost') AS has_cost, countIf(m.metric = 'expected_path_cost') AS has_optimum FROM osrs_bench.case_metrics m INNER JOIN run_set rs ON rs.run_id = m.run_id WHERE m.profile IN (${profile:sqlstring}) AND m.category IN (${category:sqlstring}) AND rs.heuristic_weight IN (${weight:sqlstring}) GROUP BY rs.heuristic_weight, m.profile, m.route_id HAVING has_cost > 0 AND has_optimum > 0 AND weighted_cost >= optimal_cost) SELECT heuristic_weight, profile, route_id, route_label, category, weighted_cost - optimal_cost AS cost_gap_ticks, weighted_cost / nullIf(optimal_cost, 0) AS cost_ratio FROM cases ORDER BY cost_gap_ticks DESC, cost_ratio DESC LIMIT 100

    - id: 12
      title: Biggest Search-space Reductions
      type: table
      gridPos: {x: 0, y: 56, w: 24, h: 10}
      datasource: *clickhouse
      targets:
        - refId: A
          format: table
          rawSql: WITH run_set AS (SELECT run_id, if(empty(metadata['heuristic_weight']), '1.0', metadata['heuristic_weight']) AS heuristic_weight, coalesce(toFloat64OrNull(nullIf(metadata['heuristic_weight'], '')), 1.0) AS weight_value FROM osrs_bench.runs WHERE if(empty(metadata['sweep']), run_id, metadata['sweep']) = ${sweep:sqlstring} AND git_commit = ${commit:sqlstring}), exact AS (SELECT m.profile, m.route_id, any(m.value) AS states FROM osrs_bench.case_metrics m INNER JOIN run_set rs ON rs.run_id = m.run_id WHERE rs.weight_value = 1 AND m.metric = 'states_popped' AND m.profile IN (${profile:sqlstring}) AND m.category IN (${category:sqlstring}) GROUP BY m.profile, m.route_id) SELECT rs.heuristic_weight, m.profile, m.route_id, any(m.route_label) AS route_label, any(m.category) AS category, e.states AS exact_states, m.value AS weighted_states, 1 - m.value / e.states AS expansion_reduction, e.states / m.value AS expansion_speedup FROM osrs_bench.case_metrics m INNER JOIN run_set rs ON rs.run_id = m.run_id INNER JOIN exact e ON e.profile = m.profile AND e.route_id = m.route_id WHERE m.metric = 'states_popped' AND e.states > 0 AND m.value > 0 AND m.profile IN (${profile:sqlstring}) AND m.category IN (${category:sqlstring}) AND rs.heuristic_weight IN (${weight:sqlstring}) GROUP BY rs.heuristic_weight, m.profile, m.route_id, e.states, m.value ORDER BY expansion_reduction DESC LIMIT 100

    - id: 13
      title: Genuine Correctness Failures
      description: Empty is healthy. Weighted suboptimal routes are excluded; this shows reachability contradictions, below-optimum costs, and exact weight-1 mismatches.
      type: table
      gridPos: {x: 0, y: 66, w: 24, h: 10}
      datasource: *clickhouse
      targets:
        - refId: A
          format: table
          rawSql: WITH run_set AS (SELECT run_id, if(empty(metadata['heuristic_weight']), '1.0', metadata['heuristic_weight']) AS heuristic_weight, coalesce(toFloat64OrNull(nullIf(metadata['heuristic_weight'], '')), 1.0) AS weight_value FROM osrs_bench.runs WHERE if(empty(metadata['sweep']), run_id, metadata['sweep']) = ${sweep:sqlstring} AND git_commit = ${commit:sqlstring}), cases AS (SELECT rs.heuristic_weight, rs.weight_value, s.profile, s.route_id, any(s.route_label) AS route_label, any(s.category) AS category, min(s.correct) AS exact_correct, quantileExact(0.5)(s.metrics['path_cost']) AS path_cost, quantileExact(0.5)(s.metrics['expected_path_cost']) AS optimal_cost, countIf(mapContains(s.metrics, 'path_cost')) AS has_cost, countIf(mapContains(s.metrics, 'expected_path_cost')) AS has_optimum FROM osrs_bench.samples s INNER JOIN run_set rs ON rs.run_id = s.run_id WHERE s.profile IN (${profile:sqlstring}) AND s.category IN (${category:sqlstring}) AND rs.heuristic_weight IN (${weight:sqlstring}) GROUP BY rs.heuristic_weight, rs.weight_value, s.profile, s.route_id) SELECT heuristic_weight, profile, route_id, route_label, category, path_cost, optimal_cost, multiIf(weight_value = 1 AND exact_correct = 0, 'weight-1 mismatch', has_optimum > 0 AND has_cost = 0, 'failed reachable route', has_optimum = 0 AND has_cost > 0, 'unexpected reachable route', 'below optimum') AS failure FROM cases WHERE (weight_value = 1 AND exact_correct = 0) OR (has_optimum > 0 AND has_cost = 0) OR (has_optimum = 0 AND has_cost > 0) OR (has_optimum > 0 AND has_cost > 0 AND path_cost < optimal_cost) ORDER BY heuristic_weight, profile, route_id
