apiVersion: dashboard.grafana.app/v1beta1
kind: Dashboard
metadata:
  name: osrs-benchmark-case
  annotations:
    grafana.app/folder: osrs-benchmarks
spec:
  title: OSRS Benchmark Case
  description: Inspect one route/profile across runs and metrics.
  tags: [osrs, benchmark]
  timezone: browser
  schemaVersion: 39
  time:
    from: now-30d
    to: now
  templating:
    list:
      - name: route
        label: Route
        type: query
        datasource: {type: grafana-clickhouse-datasource, uid: PDEE91DDB90597936}
        query: SELECT route_id AS __value, argMax(route_label, r.created_at) AS __text FROM osrs_bench.samples s INNER JOIN osrs_bench.runs r ON r.run_id = s.run_id GROUP BY route_id ORDER BY route_id
        refresh: 1
        includeAll: false
        multi: false
      - name: profile
        label: Profile
        type: custom
        options:
          - {text: early, value: early, selected: true}
          - {text: mid, value: mid}
          - {text: end, value: end}
          - {text: maxed, value: maxed}
  panels:
    - id: 1
      title: Metric History
      type: table
      gridPos: {x: 0, y: 0, w: 24, h: 12}
      datasource: {type: grafana-clickhouse-datasource, uid: PDEE91DDB90597936}
      targets:
        - refId: A
          format: table
          rawSql: SELECT r.created_at, r.run_id, r.git_commit, r.testbed, s.profile, s.route_id, s.route_label, s.correct, s.status, s.metrics['total_ms'] AS total_ms, s.metrics['search_ms'] AS search_ms, s.metrics['reverse_ms'] AS reverse_ms, s.metrics['states_popped'] AS states_popped FROM osrs_bench.samples s INNER JOIN osrs_bench.runs r ON r.run_id = s.run_id WHERE s.route_id = '${route}' AND s.profile = '${profile}' ORDER BY r.created_at
    - id: 2
      title: Raw JSON
      type: table
      gridPos: {x: 0, y: 12, w: 24, h: 12}
      datasource: {type: grafana-clickhouse-datasource, uid: PDEE91DDB90597936}
      targets:
        - refId: A
          format: table
          rawSql: SELECT r.created_at, s.run_id, s.sample_index, s.raw_json FROM osrs_bench.samples s INNER JOIN osrs_bench.runs r ON r.run_id = s.run_id WHERE s.route_id = '${route}' AND s.profile = '${profile}' ORDER BY r.created_at, s.sample_index
